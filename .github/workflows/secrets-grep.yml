# The app has zero environment variables today and will have several from week 4.
#
# In Next.js, any variable named NEXT_PUBLIC_* is compiled into the JavaScript bundle
# and served to every visitor. Naming a server-side secret that way publishes it. With
# Supabase in the stack, the worst version of this mistake is prefixing the service-role
# key with NEXT_PUBLIC_ — which hands every visitor a credential that bypasses Row Level
# Security on the entire database.
#
# NOTE: this file excludes itself from the scan below. Spelling the forbidden pattern out
# in a comment here would otherwise make the check fail on its own source.
#
# GitHub's own secret-scanning push protection catches known credential formats on this
# public repository. This check catches the naming mistake, which is the one that is
# specific to this codebase and which no generic scanner knows about.

name: Secrets

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  naming:
    name: secret-naming
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: No server-only secret may be exposed to the browser
        run: |
          set -uo pipefail

          if grep -rInE 'NEXT_PUBLIC_[A-Z0-9_]*(SERVICE_ROLE|SERVICE_KEY|SECRET|PRIVATE_KEY|PASSWORD|_TOKEN)' \
               --include='*.ts' --include='*.tsx' --include='*.js' --include='*.mjs' \
               --include='*.json' --include='*.yml' --include='*.yaml' --include='*.env*' \
               --exclude='secrets-grep.yml' \
               --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=.git \
               . ; then
            echo ""
            echo "::error::A server-only secret is named NEXT_PUBLIC_*, which ships it to every browser."
            echo "Rename it without the NEXT_PUBLIC_ prefix and read it only in server code."
            echo "See docs/configuration.md."
            exit 1
          fi

          echo "No exposed secret names found."

      - name: No committed .env file
        run: |
          set -uo pipefail

          # .env.example is the documented template and is meant to be committed.
          # Anything else matching .env* is a real environment file and must not be.
          FOUND=$(git ls-files | grep -E '(^|/)\.env' | grep -v '\.env\.example$' || true)

          if [ -n "$FOUND" ]; then
            echo "::error::An environment file is committed to the repository:"
            echo "$FOUND"
            echo ""
            echo "Remove it from git, add it to .gitignore, and ROTATE every credential"
            echo "it contained — deleting the file does not remove it from git history."
            exit 1
          fi

          echo "No environment files committed."
